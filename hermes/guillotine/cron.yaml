# hermes/guillotine/cron.yaml
# Script-only jobs run repo CLIs with no language model in the loop.
# Empty stdout means Hermes delivers nothing; only problems reach Discord.
jobs:
  - name: guillotine-health
    agent: health
    schedule: "every 5m"
    script: guillotine_health.sh
    deliver: "discord:#guillotine-ops"
    max_gap_minutes: 15
  - name: guillotine-gap-fill
    agent: gap-fill
    schedule: "every 3m"
    script: guillotine_gap_fill.sh
    deliver: local
    max_gap_minutes: 15
  - name: guillotine-sleeper-sync
    agent: sleeper-sync
    schedule: "every 10m"
    script: guillotine_sleeper_sync.sh
    deliver: "discord:#guillotine-ops"
    max_gap_minutes: 30
  - name: guillotine-run-audit
    agent: run-audit
    schedule: "0 8 * * *"
    script: guillotine_run_audit.sh
    deliver: "discord:#guillotine-ops"
    max_gap_minutes: 1500
  # Every four hours, not nightly: the directory now carries Sleeper's injury_status,
  # which is the one column on public.players that changes during a week. A Friday
  # afternoon `Out` that only landed at 05:30 the next morning would have the board
  # calling an injured starter a coverage hole all Saturday. 300 = the four-hour
  # cadence plus an hour of slack, so `ug ops audit-runs` does not false-alarm on a
  # single skipped fire.
  - name: guillotine-players-sync
    agent: players-sync
    schedule: "0 */4 * * *"
    script: guillotine_players_sync.sh
    deliver: "discord:#guillotine-ops"
    max_gap_minutes: 300
  - name: guillotine-nfl-state
    agent: nfl-state
    schedule: "every 10m"
    script: guillotine_nfl_state.sh
    deliver: "discord:#guillotine-ops"
    max_gap_minutes: 30
  # The four projections jobs share the agent name `projections-sync` on purpose: the
  # per-agent, per-minute idempotency key in run_scheduled absorbs an overlap between the
  # baseline and a game-window fire, and health checks the agent, so the */30 baseline
  # keeps all four rows fresh. Cron fields below are the Mac mini's LOCAL time
  # (America/New_York), not UTC.
  #
  # Only the */30 baseline delivers to Discord. The three game-window rows fire every
  # five minutes, and a Sleeper outage lasts as long as it lasts: routing them to the
  # channel would post the same failure twelve times an hour for hours. `deliver: local`
  # keeps their output on the mini, where the run history and `ug ops health` read it,
  # and the baseline still says it in the channel every half hour.
  - name: guillotine-sleeper-projections
    agent: projections-sync
    schedule: "*/30 * * * *"
    script: guillotine_sleeper_projections.sh
    deliver: "discord:#guillotine-ops"
    max_gap_minutes: 90
  # Game windows are in the Mac mini's local time (Central): Thursday and Monday
  # kickoffs are 7:15 PM, Sunday's first slate is noon, so each window opens the
  # hour before and runs to midnight.
  - name: guillotine-sleeper-projections-thursday
    agent: projections-sync
    schedule: "*/5 19-23 * * 4"
    script: guillotine_sleeper_projections.sh
    deliver: local
    max_gap_minutes: 90
  - name: guillotine-sleeper-projections-sunday
    agent: projections-sync
    schedule: "*/5 12-23 * * 0"
    script: guillotine_sleeper_projections.sh
    deliver: local
    max_gap_minutes: 90
  - name: guillotine-sleeper-projections-monday
    agent: projections-sync
    schedule: "*/5 19-23 * * 1"
    script: guillotine_sleeper_projections.sh
    deliver: local
    max_gap_minutes: 90
  # The four scores jobs share the agent name `scores-sync`, exactly as the projections rows
  # share theirs: one job on four schedules, with the per-agent, per-minute idempotency key in
  # run_scheduled absorbing an overlap between the baseline and a game-window fire. Cron fields
  # are the Mac mini's LOCAL time (America/New_York), not UTC.
  #
  # Every minute in a game window, because that is the whole point — Ben: "why does it show that
  # it updated at 9:30PM it should always be realtime!". Outside those windows nothing is being
  # scored, so */15 keeps the row warm without asking Sleeper 1,440 times a day for a number that
  # has not moved.
  #
  # All four deliver `local`, the baseline included. Even at */15 an outage would post four lines
  # an hour to the channel, and at */1 it is sixty; the run history on the mini is where these
  # live, `ug ops health` is the standing answer between edges, and `run_scheduled_with_notes`
  # still posts one note to #guillotine-ops on the edge — the first failure and the recovery.
  - name: guillotine-sleeper-scores
    agent: scores-sync
    schedule: "*/5 * * * *"
    script: guillotine_sleeper_scores.sh
    deliver: local
    max_gap_minutes: 20
  - name: guillotine-sleeper-scores-thursday
    agent: scores-sync
    schedule: "* 19-23 * * 4"
    script: guillotine_sleeper_scores.sh
    deliver: local
    max_gap_minutes: 45
  - name: guillotine-sleeper-scores-sunday
    agent: scores-sync
    schedule: "* 12-23 * * 0"
    script: guillotine_sleeper_scores.sh
    deliver: local
    max_gap_minutes: 45
  - name: guillotine-sleeper-scores-monday
    agent: scores-sync
    schedule: "* 19-23 * * 1"
    script: guillotine_sleeper_scores.sh
    deliver: local
    max_gap_minutes: 45
  # There is deliberately no draft job here. The auction is synced by hand once a year with
  # `ug sleeper draft` (Ben, 2026-09-10: "drop the cron it's a waste. have this as a script
  # that we just run once a year").
  # The executed transaction log — trades, drops, claims — at the roster sync's cadence,
  # because it moves whenever a manager does. Current and previous week each run; a full
  # backfill is `ug sleeper transactions --all` by hand.
  - name: guillotine-sleeper-transactions
    agent: transactions-sync
    schedule: "every 10m"
    script: guillotine_sleeper_transactions.sh
    deliver: "discord:#guillotine-ops"
    max_gap_minutes: 30
  # The Guillotine Daily: every roster's score and projected finish, who is on the
  # block, the gulag pair, and the odds -- a short text and an HTML file to the chat
  # through the delivery layer (self-test chat in test mode), previewed in
  # #guillotine-drafts. The mornings are Ben's (2026-09-10): a break on Tuesdays;
  # Wednesday before waivers close (Thursday 2 AM); Thursday after they clear;
  # Friday after the Thursday game; Sunday and Monday after Saturday's free agency
  # and Sunday's games. 8:15 AM Central, after the 8 AM players sync. The gap budget
  # clears the Monday-to-Wednesday gap plus slack. The job name is the agent's
  # codename and is kept so the registered job is edited, never duplicated.
  - name: guillotine-eod-summary
    agent: eod-summary
    schedule: "15 8 * * 0,1,3,4,5"
    script: guillotine_eod_summary.sh
    deliver: "discord:#guillotine-ops"
    max_gap_minutes: 3000
  - name: guillotine-video-jobs
    agent: video-jobs
    schedule: "every 2m"
    script: guillotine_video_jobs.sh
    deliver: "discord:#guillotine-ops"
    max_gap_minutes: 30
