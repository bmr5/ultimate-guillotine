<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/guillotine.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Guillotine League</title>

    <!--
      The site is one read-only board: this week's projections, records and rosters for the
      league, and nothing to join or sign up for. The copy below says so, in place of the
      scaffold's recruitment pitch and its unfilled author placeholder.
    -->
    <meta
      name="description"
      content="The live board for the Ultimate Guillotine League: this week's projections, records, FAAB and rosters for every surviving team."
    />
    <meta
      name="keywords"
      content="fantasy football, guillotine league, league board, projections, standings"
    />
    <meta name="author" content="Ultimate Guillotine League" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Ultimate Guillotine League" />
    <meta
      property="og:description"
      content="The live board for the Ultimate Guillotine League: this week's projections, records, FAAB and rosters for every surviving team."
    />
    <meta
      property="og:image"
      content="https://www.ultimateguillotineleague.com/guillotine-social.jpeg"
    />
    <meta
      property="og:url"
      content="https://www.ultimateguillotineleague.com"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ultimate Guillotine League" />

    <!-- Twitter Card Meta Tags. The league has no account, so there is no site handle. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ultimate Guillotine League" />
    <meta
      name="twitter:description"
      content="The live board for the Ultimate Guillotine League: this week's projections, records, FAAB and rosters for every surviving team."
    />
    <meta
      name="twitter:image"
      content="https://www.ultimateguillotineleague.com/guillotine-social.jpeg"
    />
    <meta
      name="twitter:url"
      content="https://www.ultimateguillotineleague.com"
    />

    <!-- Apple Touch Icon for iOS devices -->
    <link rel="apple-touch-icon" href="/guillotine-social.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
